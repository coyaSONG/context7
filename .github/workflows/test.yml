name: Test

on:
  # This workflow is a required check, so it must report for every PR. Path
  # filters would otherwise leave documentation and workflow PRs blocked.
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:check

      - name: Format
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        shell: bash
        run: |
          if [[ -n "$CONTEXT7_API_KEY" ]]; then
            pnpm test
          else
            echo "CONTEXT7_API_KEY is unavailable; running the offline test suite."
            pnpm --recursive \
              --filter '!@upstash/context7-sdk' \
              --filter '!@upstash/context7-tools-ai-sdk' \
              run test
            pnpm --filter @upstash/context7-sdk exec vitest run src/http/index.test.ts
          fi
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
